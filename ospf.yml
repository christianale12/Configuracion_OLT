# Topologia OSPF en anillo detectada en GNS3 (por MACs de vecinos):
#   R1--R2  red 10.0.12.0/24
#   R2--R4  red 10.0.24.0/24
#   R4--R3  red 10.0.34.0/24
#   R3--R1  red 10.0.13.0/24
# La app NO depende de interfaces: por equipo se configura el router-id,
# el loopback (/32 del router-id) y las redes OSPF. OSPF se levanta solo
# en las interfaces que esten dentro de esas redes.
ospf:
  area: 0.0.0.0
  redistribute-connected: true
  equipos:
    - host: 192.168.26.131
      usuario: admin
      password: "123"
      router-id: 1.1.1.1
      networks:
        - 10.0.12.0/24
        - 10.0.13.0/24
        - 1.1.1.1/32
    - host: 192.168.26.133
      usuario: admin
      password: "123"
      router-id: 2.2.2.2
      networks:
        - 10.0.12.0/24
        - 10.0.24.0/24
        - 2.2.2.2/32
    - host: 192.168.26.134
      usuario: admin
      password: "123"
      router-id: 3.3.3.3
      networks:
        - 10.0.13.0/24
        - 10.0.34.0/24
        - 3.3.3.3/32
    - host: 192.168.26.132
      usuario: admin
      password: "123"
      router-id: 4.4.4.4
      networks:
        - 10.0.24.0/24
        - 10.0.34.0/24
        - 4.4.4.4/32